<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2b5e"/>
      <stop offset="60%" style="stop-color:#1a4a8a"/>
      <stop offset="100%" style="stop-color:#0f3566"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle glow center -->
  <ellipse cx="400" cy="225" rx="320" ry="200" fill="url(#glow)"/>

  <!-- Network lines (behind nodes) -->
  <g stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <line x1="200" y1="120" x2="320" y2="190"/>
    <line x1="320" y1="190" x2="400" y2="225"/>
    <line x1="400" y1="225" x2="480" y2="170"/>
    <line x1="480" y1="170" x2="600" y2="200"/>
    <line x1="400" y1="225" x2="350" y2="310"/>
    <line x1="400" y1="225" x2="520" y2="320"/>
    <line x1="350" y1="310" x2="220" y2="330"/>
    <line x1="520" y1="320" x2="620" y2="310"/>
    <line x1="480" y1="170" x2="560" y2="100"/>
    <line x1="200" y1="120" x2="130" y2="200"/>
    <line x1="130" y1="200" x2="220" y2="330"/>
    <line x1="600" y1="200" x2="620" y2="310"/>
    <line x1="320" y1="190" x2="350" y2="310"/>
  </g>

  <!-- Outer data nodes (small) -->
  <g fill="#60a5fa" opacity="0.7">
    <circle cx="200" cy="120" r="5"/>
    <circle cx="480" cy="170" r="5"/>
    <circle cx="600" cy="200" r="5"/>
    <circle cx="350" cy="310" r="5"/>
    <circle cx="520" cy="320" r="5"/>
    <circle cx="220" cy="330" r="5"/>
    <circle cx="620" cy="310" r="5"/>
    <circle cx="130" cy="200" r="5"/>
    <circle cx="560" cy="100" r="5"/>
  </g>

  <!-- Mid nodes -->
  <g fill="#93c5fd" opacity="0.85">
    <circle cx="320" cy="190" r="7"/>
  </g>

  <!-- Central hub glow -->
  <circle cx="400" cy="225" r="48" fill="#1d4ed8" opacity="0.35" filter="url(#blur)"/>
  <circle cx="400" cy="225" r="36" fill="#2563eb" opacity="0.5"/>
  <circle cx="400" cy="225" r="28" fill="#1d4ed8"/>

  <!-- Health cross inside hub -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="394" y="210" width="12" height="30" rx="2"/>
    <rect x="385" y="219" width="30" height="12" rx="2"/>
  </g>

  <!-- EU stars (12 stars in a circle) around the hub -->
  <g fill="#fbbf24" opacity="0.85">
    <g transform="translate(400,225)">
      <!-- 12 stars evenly spaced at radius 70 -->
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(30) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(60) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(90) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(120) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(150) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(180) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(210) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(240) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(270) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(300) translate(0,-70)"/>
      <polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4.1 0,2 -2.9,4.1 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" transform="rotate(330) translate(0,-70)"/>
    </g>
  </g>

  <!-- Label EHDS bottom -->
  <text x="400" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="4">EUROPEAN HEALTH DATA SPACE</text>
</svg>
